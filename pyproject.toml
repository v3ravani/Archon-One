[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archon-one"
version = "0.4.1"
description = "A comprehensive repository intelligence platform that transforms software projects into actionable insights, interactive architecture diagrams, and a searchable Knowledge Graph for faster understanding, navigation, and analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Viraj Ravani", email = "viraj.ravani@somaiya.edu" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "tabulate>=0.9.0",
    "pandas>=2.1.0",
    "GitPython>=3.1.0",
    "psutil>=5.9.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build",
    "twine",
]

[project.scripts]
archon = "archon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archon = ["templates/*"]
